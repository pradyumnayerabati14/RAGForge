services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ragforge
      POSTGRES_USER: ragforge
      POSTGRES_PASSWORD: ragforge
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragforge"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      RAGFORGE_BACKEND: postgres
      RAGFORGE_DATABASE_URL: postgresql://ragforge:ragforge@postgres:5432/ragforge
      RAGFORGE_OPENAI_API_KEY: ${RAGFORGE_OPENAI_API_KEY:-}
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata:

